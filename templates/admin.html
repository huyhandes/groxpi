<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>groxpi · cache</title>
<!-- Datastar loads from its CDN; nothing here is vendored. Without it (an
     air-gapped network, a blocked CDN) every control still works as a plain
     form or link, a full page load at a time. -->
<script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.4/bundles/datastar.js"></script>
<style>
  :root {
    --ground: #f2f4f7; --surface: #fff; --raised: #e8ebf0; --rule: #edf0f3; --control: #d3d8df;
    --text: #0a0a0a; --muted: #5f6672; --accent: #141414; --data: #1d5fbf; --negative: #c4242a;
    --radius-card: 8px; --radius-control: 6px; --gap: 16px; --pad: 24px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); background: var(--ground);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
  .bar, main { max-width: 1100px; margin: 0 auto; padding: 0 var(--pad); }
  .bar { display: flex; align-items: center; gap: 10px; height: 56px; font-weight: 500; }
  .bar span { color: var(--muted); font-weight: 400; }
  main { padding-bottom: 64px; }

  .title { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--gap); margin: 24px 0 var(--pad); }
  h1 { font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .title p { margin: 4px 0 0; color: var(--muted); }

  form { margin: 0; }
  .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  input, button { font: inherit; height: 36px; border-radius: var(--radius-control); }
  input { border: 1px solid var(--control); background: var(--surface); padding: 0 12px; min-width: 0; }
  input:hover { border-color: #b6bdc7; }
  button { border: 0; padding: 0 14px; cursor: pointer; background: var(--raised); color: var(--text); transition: transform .08s, background .12s; }
  button:hover { background: #dde1e7; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: #333; }
  button.small { height: 28px; padding: 0 10px; font-size: 13px; }
  .status { margin: 0; color: var(--muted); }
  .status:empty { display: none; }

  .panel { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); margin-bottom: var(--gap); }
  .panel > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--gap); margin-bottom: 12px; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); margin: 0; }

  .failures h2 { color: var(--negative); }
  .failures ul { margin: 0; padding: 0; list-style: none; }
  .failures li { padding: 6px 0; }
  .failures time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 400; color: var(--muted); font-size: 13px; padding: 0 12px 8px 0; }
  td { padding: 10px 12px 10px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
  th:last-child, td:last-child { padding-right: 0; }
  .num { text-align: right; white-space: nowrap; }
  .muted { color: var(--muted); }
  tr.pkg td { border-top-color: var(--raised); }
  tr.pkg strong { font-weight: 600; }
  tr.file td { border-top: 0; padding-top: 2px; padding-bottom: 6px; color: var(--muted); }
  tr.file td:first-child { padding-left: 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; word-break: break-all; }

  .progress { display: block; height: 4px; background: var(--raised); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--data); }

  .pager { display: flex; justify-content: space-between; align-items: center; gap: var(--gap); margin-top: 16px; color: var(--muted); }
  .pager nav { display: flex; gap: 16px; }

  @media (max-width: 640px) {
    :root { --pad: 16px; }
    .title, .title .inline, .title input { width: 100%; }
    .title input { flex: 1; }
    th.age, td.age { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<!-- The page polls in-flight downloads every 3s while the tab is visible. The
     interval sits here, not on #inflight, because a reply morphs #inflight. -->
<body data-on-interval__duration.3s="!document.hidden && @get('/admin/inflight', {contentType: 'form', selector: '#filter-form'})">
<header class="bar">
  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="4" rx="1" fill="#141414"/><rect x="2" y="8.5" width="16" height="4" rx="1" fill="#141414"/><rect x="2" y="14" width="10" height="4" rx="1" fill="#1d5fbf"/></svg>
  groxpi <span>PyPI cache</span>
</header>

<main>
<div class="title">
  <div>
    <h1>Package cache</h1>
    <p>Every package pip has pulled through this proxy, by name.</p>
  </div>
  <!-- Without JavaScript the form posts and the browser shows the plain-text
       reply. With Datastar the server answers a #prefetch-status fragment. -->
  <form class="inline" method="post" action="/admin/prefetch"
        data-on:submit__prevent="@post('/admin/prefetch', {contentType: 'form'})">
    <input name="package" placeholder="Package name" aria-label="Package to prefetch" required autocomplete="off">
    <button type="submit" class="primary">Prefetch newest release</button>
  </form>
</div>
<p id="prefetch-status" class="status" role="status"></p>

{{template "inflight" .}}

<section class="panel" aria-labelledby="cache-heading">
  <header>
    <h2 id="cache-heading">Cached packages</h2>
    <!-- A plain GET: the listing is paged on the server, so the query reaches
         admin.List. The page and generation inputs live in #cache and join
         this form by its id; the Filter button's page=1 comes first in a plain
         submit, so a new filter starts at page 1 (Go reads the first value).
         With Datastar, typing resets the page and reloads #cache. -->
    <form id="filter-form" class="inline" method="get" action="/admin" role="search"
          data-on:submit__prevent="document.getElementById('page').value = 1; @get('/admin/rows', {contentType: 'form'})">
      <input id="filter" name="q" type="search" value="{{.Filter}}" placeholder="Filter packages" aria-label="Filter packages" autocomplete="off"
             data-on:input__debounce.300ms="document.getElementById('page').value = 1; @get('/admin/rows', {contentType: 'form'})">
      <button type="submit" name="page" value="1">Filter</button>
      <button type="button" data-on:click="@get('/admin/rows', {contentType: 'form'})">Refresh</button>
    </form>
  </header>
  <p id="evict-status" class="status" role="status"></p>
  {{template "rows" .}}
</section>
</main>
</body>
</html>
