name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.26.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      if: matrix.os == 'ubuntu-latest'
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      if: matrix.os == 'ubuntu-latest'
      run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

    - name: Run staticcheck
      if: matrix.os == 'ubuntu-latest'
      run: staticcheck ./...

    - name: Run tests
      run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  minio:
    name: MinIO Integration
    runs-on: ubuntu-latest
    env:
      TEST_S3_ENDPOINT: localhost:9000
      TEST_S3_ACCESS_KEY: minioadmin
      TEST_S3_SECRET_KEY: minioadmin
      TEST_S3_BUCKET: groxpi-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    # MinIO no longer publishes public images, so build the server from a
    # pinned release tag with the runner's Go and run it in the background.
    - name: Cache MinIO binary
      id: minio-cache
      uses: actions/cache@v4
      with:
        path: ~/minio-bin
        key: minio-${{ runner.os }}-RELEASE.2025-10-15T17-29-55Z

    - name: Build MinIO
      if: steps.minio-cache.outputs.cache-hit != 'true'
      run: GOBIN="$HOME/minio-bin" go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z

    - name: Start MinIO and create the bucket
      env:
        MINIO_ROOT_USER: ${{ env.TEST_S3_ACCESS_KEY }}
        MINIO_ROOT_PASSWORD: ${{ env.TEST_S3_SECRET_KEY }}
        AWS_ACCESS_KEY_ID: ${{ env.TEST_S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ env.TEST_S3_SECRET_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        nohup "$HOME/minio-bin/minio" server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
        for _ in $(seq 1 60); do
          curl -fsS http://localhost:9000/minio/health/live && break
          sleep 1
        done
        curl -fsS http://localhost:9000/minio/health/live || { cat /tmp/minio.log; exit 1; }
        aws --endpoint-url http://localhost:9000 s3 mb "s3://$TEST_S3_BUCKET"

    - name: Run MinIO tests
      # TestS3WithRealClients is excluded: it needs pip/uv and real PyPI. The
      # tests skip when MinIO is unreachable, so a skip fails this job.
      shell: bash
      run: |
        go test -race -run 'MinIO' -v ./internal/storage/... | tee minio-test.out
        if grep -q -- '--- SKIP' minio-test.out; then
          echo "MinIO tests skipped: MinIO was not reachable" >&2
          exit 1
        fi
        # A renamed test or a -run pattern that matches nothing passes with zero
        # tests run; require each one by name.
        for want in '--- PASS: TestS3WithMinIO_RejectsChecksumTrailers' '--- PASS: TestS3WithMinIO '; do
          if ! grep -qF -- "$want" minio-test.out; then
            echo "missing from MinIO test output: $want" >&2
            exit 1
          fi
        done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
        gosec -no-fail -fmt sarif -out gosec-report.sarif -exclude-generated ./...
        # Remove fixes array from SARIF to avoid GitHub validation errors
        if [ -f gosec-report.sarif ]; then
          # Use jq to remove the fixes field from all results
          jq 'del(.runs[].results[].fixes)' gosec-report.sarif > gosec-report-clean.sarif
          mv gosec-report-clean.sarif gosec-report.sarif
        fi

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec-report.sarif

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        # v6 resolves "latest" to the v1 line, which is built with go1.24 and
        # refuses a go1.26 target. Pin the v2 release used locally.
        version: v2.12.2
        args: --timeout=10m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Build binary
      run: |
        go build -ldflags="-s -w" -o groxpi cmd/groxpi/main.go
        ls -la groxpi
        echo "Binary built successfully"

    - name: Test Docker build
      run: docker build -t groxpi:test .