# Docker Compose configuration for benchmarking groxpi vs proxpi
# Usage: docker compose -f benchmarks/docker/docker-compose.benchmark.yml up

services:
  # groxpi service for benchmarking
  groxpi-bench:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Its own tag, so the image built from this checkout is never confused with
    # a groxpi:latest from the other compose files. benchmark.sh rebuilds it once
    # at the start of a suite run; recreating for a cold run does not rebuild.
    image: groxpi:bench
    container_name: groxpi-bench
    restart: unless-stopped
    ports:
      - "5005:5000"
    environment:
      # PyPI Configuration
      GROXPI_INDEX_URL: https://pypi.org/simple/
      GROXPI_CACHE_SIZE: 5368709120 # 5GB
      GROXPI_INDEX_TTL: 1800 # 30 minutes
      GROXPI_CACHE_DIR: /cache
      GROXPI_LOGGING_LEVEL: INFO
      GROXPI_STORAGE_TYPE: local
    # Anonymous cache volumes: scripts/cache_manager.sh empties a cache with
    # `docker compose rm -sfv`, which removes anonymous volumes but not named ones.
    volumes:
      - /cache
    healthcheck:
      # scratch image: no shell, no wget. The binary is its own probe.
      test: ["CMD", "/groxpi", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      # Probe every second while starting, so a cold run's `up --wait` returns
      # as soon as the proxy is healthy rather than after the first 30s interval.
      start_interval: 1s
    labels:
      - "benchmark.service=groxpi"
    networks:
      - benchmark-network

  # proxpi service for comparison
  proxpi-bench:
    image: epicwink/proxpi:latest
    container_name: proxpi-bench
    restart: unless-stopped
    ports:
      - "5006:5000"
    environment:
      # PyPI Configuration (matching groxpi settings)
      PROXPI_INDEX_URL: https://pypi.org/simple/
      PROXPI_CACHE_SIZE: 5368709120 # 5GB
      PROXPI_INDEX_TTL: 1800 # 30 minutes
      PROXPI_CACHE_DIR: /var/cache/proxpi
      PROXPI_LOGGING_LEVEL: INFO
    volumes:
      - /var/cache/proxpi
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      # Probe every second while starting, so a cold run's `up --wait` returns
      # as soon as the proxy is healthy rather than after the first 30s interval.
      start_interval: 1s
    labels:
      - "benchmark.service=proxpi"
    networks:
      - benchmark-network

networks:
  benchmark-network:
    name: benchmark-network
    driver: bridge