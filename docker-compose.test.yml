# Docker Compose configuration for groxpi testing with RustFS
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait s3-test
#   docker compose -f docker-compose.test.yml run --rm s3-test-init
#   go test -race -run 'TestS3WithMinIO' ./internal/storage/
#   TEST_S3_ENDPOINT=localhost:9000 go test -race -run TestS3WithRealClients ./internal/storage/
# `up --wait` is scoped to s3-test: s3-test-init is one-shot and nothing depends
# on it, so a bare `up --wait` reports its exit as a failure. `run` blocks until
# the bucket exists. Credentials, port 9000 and bucket groxpi-test match the
# integration tests' defaults; TestS3WithRealClients alone is opt-in via
# TEST_S3_ENDPOINT (it also needs python3, uv and PyPI access).

services:
  # RustFS S3-compatible storage for testing (https://github.com/rustfs/rustfs)
  s3-test:
    image: rustfs/rustfs:1.0.4
    container_name: groxpi-s3-test
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - s3_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  # One-shot test bucket creation (path-style; see docker-compose.rustfs.yml)
  s3-test-init:
    image: amazon/aws-cli:2.39.0
    container_name: groxpi-s3-test-init
    depends_on:
      s3-test:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3-test:9000
    entrypoint: >
      /bin/sh -ec "
      aws configure set default.s3.addressing_style path;
      aws s3api head-bucket --bucket groxpi-test 2>/dev/null || aws s3 mb s3://groxpi-test
      "
    networks:
      - test-network

volumes:
  s3_test_data:
    driver: local

networks:
  test-network:
    driver: bridge
