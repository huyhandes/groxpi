global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # groxpi is NOT scraped: it serves no Prometheus exposition endpoint. It exports
  # logs, metrics and traces over OTLP to a collector (OTEL_EXPORTER_OTLP_ENDPOINT),
  # and the collector's `prometheus` exporter is what Prometheus reads here.
  # See docs/adr/0002-otlp-over-prometheus-scrape.md.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']