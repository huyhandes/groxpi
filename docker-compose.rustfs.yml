# Docker Compose configuration for groxpi with RustFS S3 storage
# Usage: docker compose -f docker-compose.rustfs.yml up -d --wait

services:
  # RustFS S3-compatible storage (https://github.com/rustfs/rustfs)
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: groxpi-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - groxpi-network

  # One-shot bucket creation; groxpi only probes the bucket (HeadBucket) and
  # never creates it.
  s3-init:
    image: amazon/aws-cli:2.39.0
    container_name: groxpi-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
    # Any failure fails the container, so groxpi (service_completed_successfully)
    # never starts against a missing bucket. Path-style: RustFS serves
    # virtual-hosted buckets only when RUSTFS_SERVER_DOMAINS is set.
    entrypoint: >
      /bin/sh -ec "
      aws configure set default.s3.addressing_style path;
      aws s3api head-bucket --bucket groxpi 2>/dev/null || aws s3 mb s3://groxpi
      "
    networks:
      - groxpi-network

  # groxpi with S3 storage
  groxpi:
    build:
      context: .
      dockerfile: Dockerfile
    image: groxpi:latest
    container_name: groxpi
    restart: unless-stopped
    # Shutdown drains requests and prefetches, then flushes telemetry; Docker's
    # 10s default would SIGKILL that mid-flush. See docs/deployment.md.
    stop_grace_period: 30s
    depends_on:
      s3-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      # PyPI Configuration
      GROXPI_INDEX_URL: https://pypi.org/simple/
      GROXPI_INDEX_TTL: 1800
      GROXPI_LOGGING_LEVEL: INFO
      
      # S3 Storage Configuration
      GROXPI_STORAGE_TYPE: s3
      AWS_ENDPOINT_URL: s3:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      GROXPI_S3_BUCKET: groxpi
      GROXPI_S3_PREFIX: packages
      GROXPI_S3_USE_SSL: "false"
      GROXPI_S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "/groxpi", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - groxpi-network

volumes:
  s3_data:
    driver: local

networks:
  groxpi-network:
    driver: bridge